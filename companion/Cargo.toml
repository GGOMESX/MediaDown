[package]
name = "mediadown-host"
version = "1.0.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
fs4 = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"
